version: '3.8'

services:
  postgres_db:
    image: postgres:14
    container_name: hospital_db_container
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=123456
      - POSTGRES_USER=root
      - POSTGRES_DB=postgres
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  volumes:
    db_data:
